<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gravitational Lensing Simulation</title>
    <meta name="description" content="Interactive 3D animation of a gravitational wave from a binary black hole merger, lensed by a galaxy or a galaxy cluster on its way to the detector: strong lensing, weak lensing and microlensing.">

        A single self-contained file: open it in a web browser (three.js is loaded from a CDN, so

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000000;
            font-family: 'LMText', serif;
            color: #ffffff;
        }
        canvas {
            display: block;
        }
        /* Strain read-out of the detector (press H to hide it) */
        #hpanel {
            position: fixed;
            left: 50%;
            bottom: 16px;
            transform: translateX(-50%);
            width: min(900px, 94vw);
            height: 170px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(141, 179, 226, 0.7);
            pointer-events: none;
            z-index: 10;
        }
        #hpanel canvas {
            width: 100%;
            height: 100%;
        }
        /* Controls: source position, lens type, observer view */
        #ui {
            position: fixed;
            top: 16px;
            left: 16px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(141, 179, 226, 0.7);
            padding: 10px 14px 9px;
            font-size: 16px;
            z-index: 10;
        }
        #ui .title { color: #8DB3E2; margin-bottom: 4px; }
        #ui .row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
        #ui input[type=range] { width: 170px; accent-color: #8DB3E2; }
        #ui .mi { font-family: 'CMMath', serif; }
        #ui .mu { font-family: 'CMMain', serif; }
        #ui button {
            background: transparent;
            border: 1px solid rgba(141, 179, 226, 0.7);
            color: #ffffff;
            font-family: 'LMText', serif;
            font-size: 15px;
            padding: 3px 10px;
            cursor: pointer;
        }
        #ui button:hover { background: rgba(141, 179, 226, 0.15); }
        #ui .hint { font-size: 13px; color: rgba(255, 255, 255, 0.55); }
        #ui .regime { color: #8DB3E2; margin-bottom: 8px; }
        #ui button.on { background: rgba(141, 179, 226, 0.3); }
        /* Caustics and critical curves (press K to hide) */
        #caustics {
            position: fixed;
            top: 16px;
            right: 16px;
            width: 460px;
            height: 270px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(141, 179, 226, 0.7);
            z-index: 10;
        }
        #caustics canvas { width: 100%; height: 100%; cursor: crosshair; }
        /* Scenario menu */
        #ui select {
            flex: 1;
            min-width: 0;
            background: #000000;
            border: 1px solid rgba(141, 179, 226, 0.7);
            color: #ffffff;
            font-family: 'LMText', serif;
            font-size: 15px;
            padding: 3px 6px;
            cursor: pointer;
        }
        #ui .row .title { margin-bottom: 0; }
        #ui select optgroup { background: #000000; color: #8DB3E2; }
        #ui select option { background: #000000; color: #ffffff; }
        /* What the current scenario shows (press I to hide it); placed by layoutInfo() */
        #info {
            position: fixed;
            top: 16px;
            left: 434px;
            width: 600px;
            box-sizing: border-box;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(141, 179, 226, 0.7);
            padding: 9px 14px 10px;
            font-size: 15px;
            line-height: 1.4;
            color: rgba(255, 255, 255, 0.88);
            z-index: 10;
        }
        #info .head { color: #8DB3E2; font-size: 16px; margin-bottom: 3px; cursor: pointer; }
        #info .tog { float: right; margin-left: 12px; font-size: 13px; color: rgba(255, 255, 255, 0.45); }
        #info .tog::after { content: 'hide'; }
        #info.collapsed .tog::after { content: 'show'; }
        #info.collapsed .body, #info.collapsed .look { display: none; }
        #info.collapsed .head { margin-bottom: 0; }
        #info .look { color: rgba(255, 255, 255, 0.6); margin-top: 6px; font-size: 14px; }
        #info .mi { font-family: 'CMMath', serif; }
        #info .mu { font-family: 'CMMain', serif; }
        /* Short screens (laptops, projectors): tighter controls, no keyboard hints, shorter explanation */
        @media (max-height: 820px) {
            #ui { padding: 8px 12px 2px; font-size: 15px; }
            #ui .row { margin-bottom: 6px; }
            #ui .regime { margin-bottom: 6px; }
            #ui .hint, #info .look { display: none; }
        }
        @media (max-width: 1450px) {
            #info { font-size: 14px; line-height: 1.38; }
            #info .head { font-size: 15px; }
        }
        /* Phones and small windows: smaller panels, no keyboard hints */
        @media (max-width: 760px) {
            #ui { top: 8px; left: 8px; padding: 6px 9px 4px; font-size: 13px; }
            #ui .row { gap: 6px; margin-bottom: 6px; }
            #ui input[type=range] { width: 120px; }
            #ui button, #ui select { font-size: 12px; padding: 2px 6px; }
            #ui .hint { display: none; }
            #info { font-size: 13px; padding: 6px 9px; }
            #info .head { font-size: 14px; }
            #info .look { font-size: 12px; }
            #caustics { top: auto; bottom: 146px; left: 8px; right: 8px; width: auto; height: 190px; }
            #hpanel { bottom: 8px; height: 130px; }
        }
        /* Credit line */
        #credit {
            position: fixed;
            right: 10px;
            bottom: 1px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.5);
            text-shadow: 0 0 3px #000000, 0 0 2px #000000;
            z-index: 10;
        }
        #credit a { color: inherit; text-decoration: none; border-bottom: 1px dotted rgba(255, 255, 255, 0.3); }
        #credit a:hover { color: #8DB3E2; }
    </style>
</head>
<body>
    <div id="hpanel"><canvas id="hcanvas"></canvas></div>
    <div id="ui">
        <div class="row"><span class="title">Scenario</span><select id="scenario" aria-label="Scenario"></select></div>
        <div class="title">Source position</div>
        <div class="row"><input type="range" id="yslider" min="0" max="2.5" step="0.01" value="0.3"><span id="yval"></span></div>
        <div class="title">Lens ellipticity</div>
        <div class="row"><input type="range" id="eslider" min="0" max="0.5" step="0.01" value="0"><span id="eval"></span></div>
        <div class="regime" id="regime"></div>
        <div class="row"><button id="btnLens">Switch to cluster</button><button id="btnMicro">Microlensing</button><button id="btnObs">Observer view</button></div>
        <div class="row"><button id="btnCaustics">Hide caustics</button><button id="btnWave">Hide waveform</button><button id="btnLink" title="Copy a link that opens this configuration">Copy link</button></div>
        <div class="hint">Keys: C lens, M microlensing, O view, K caustics, H waveform,<br>Space pause, R replay, I explanation, U hide this panel</div>
    </div>
    <div id="caustics"><canvas id="ccanvas"></canvas></div>
    <div id="info"></div>
    <div id="credit">Xavier Garcia Sàbat · based on <a href="https://ler.hemantaph.com" target="_blank" rel="noopener">ler</a> by H. Phurailatpam · <a href="https://github.com/XxavierGarcia/gw-lensing-animation" target="_blank" rel="noopener">GitHub</a></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { FontLoader } from 'three/addons/loaders/FontLoader.js';
        import { TextGeometry } from 'three/addons/geometries/TextGeometry.js';

        let scene, camera, renderer, controls, font;
        let spacetimePlane, staticVertices;
        let galaxyGroup, clusterGroup, sourceGroup, bh1, bh2, mergedBH, mergeFlash, detector;
        let detectorArm1, detectorArm2; // References for animation
        let detectorLabel, microStar;
        const clock = new THREE.Clock();
        const textLabels = [];   // all labels, kept facing the camera
        let lensLabels = [];     // labels rebuilt whenever the lens or the source changes
        let pathLines = [];
        const billboards = [];   // light quads that always face the camera
        const skyImages = [];    // what the observer sees: one glowing dot per image

        // --- Configuration ---
        const X_DISTANCE = 220;
        const GRID_SIZE = 450;
        const GRID_SEGMENTS = 120;
        const GRID_ELEV = 5;

        // --- Lens models: isothermal ellipsoids (angles in units of theta_E) ---
        // galaxy:  singular isothermal ellipsoid (SIE); round, it is the SIS with alpha = 1
        // cluster: the same with a core xc; round, alpha = x / (sqrt(x^2 + xc^2) + xc), and the core adds a
        //          faint central image (type III) that arrives last
        // Ellipticity (1 - axis ratio) opens the point-like tangential caustic into a diamond: a source
        // inside it has four bright images. Images solve the 2D lens equation y = x - alpha(x);
        // mu = 1 / det(dy/dx); arrival-time delay tau = |x - y|^2 / 2 - psi(x), psi the lensing potential.
        const LENSES = {
            galaxy: { name: 'Lensing Galaxy', model: 'SIS lens', thetaE: 60, wellDepth: 60, wellRadius: 120, core: 0, delayScale: 3.0, labelY: 50 },
            cluster: { name: 'Lensing Cluster', model: 'Cored isothermal cluster', thetaE: 90, wellDepth: 80, wellRadius: 175, core: 0.1, delayScale: 4.5, labelY: 75 },
        };
        let lens = LENSES.galaxy;
        let sourceY = 0.3;                   // beta / theta_E, set with the slider
        let sourcePhi = 0;                   // direction of the source on the sky (drag it in the caustics panel)
        let ellipticity = 0;                 // 1 - axis ratio of the lens, set with the second slider
        let microOn = false;
        let activeScenario = null;           // the preset shown in the menu, or null after any manual change
        let simTime = 0, paused = false;     // animation clock, stopped while paused (Space)
        let infoFoldedByView = false;        // the observer view folded the explanation and will unfold it

        // --- Microlensing by a star near image 1 (point-mass lens), with wave optics ---
        // The star multiplies the signal by the amplification factor (Takahashi & Nakamura 2003)
        //   F(w, y) = exp[pi w/4 + i w/2 (ln(w/2) - 2 phi_m)] Gamma(1 - i w/2) 1F1(i w/2; 1; i w y^2/2),
        // with w = 2 pi f (4 G M / c^3) and phi_m = (x_m - y)^2/2 - ln x_m, x_m = (y + sqrt(y^2 + 4))/2.
        // At low frequency the wavelength is larger than the star's Schwarzschild radius and the wave
        // bends around it (|F| -> 1); at high frequency it tends to geometric optics: two micro-images,
        // the second one delayed and with phase -pi/2, which interfere.
        const MICRO_Y = 0.7;            // source offset in units of the star's Einstein radius
        const MICRO_TM = 0.05;          // 4GM/c^3 of the star, in animation seconds
        const cx = (re, im = 0) => ({ re, im });
        const cadd = (a, b) => cx(a.re + b.re, a.im + b.im);
        const cmul = (a, b) => cx(a.re * b.re - a.im * b.im, a.re * b.im + a.im * b.re);
        const cdiv = (a, b) => { const d = b.re * b.re + b.im * b.im; return cx((a.re * b.re + a.im * b.im) / d, (a.im * b.re - a.re * b.im) / d); };
        const cexp = (a) => { const m = Math.exp(a.re); return cx(m * Math.cos(a.im), m * Math.sin(a.im)); };
        const LANCZOS = [0.99999999999980993, 676.5203681218851, -1259.1392167224028, 771.32342877765313,
            -176.61502916214059, 12.507343278686905, -0.13857109526572012, 9.9843695780195716e-6, 1.5056327351493116e-7];
        function cgamma(z) {   // Lanczos approximation, Re z >= 1/2
            const zm = cx(z.re - 1, z.im);
            let x = cx(LANCZOS[0]);
            for (let i = 1; i < 9; i++) x = cadd(x, cdiv(cx(LANCZOS[i]), cx(zm.re + i, zm.im)));
            const t = cx(zm.re + 7.5, zm.im);
            const logt = cx(Math.log(Math.hypot(t.re, t.im)), Math.atan2(t.im, t.re));
            const p = cexp(cadd(cmul(cx(zm.re + 0.5, zm.im), logt), cx(-t.re, -t.im)));
            return cmul(cx(Math.sqrt(2 * Math.PI)), cmul(p, x));
        }
        function hyp1f1(a, z) {   // confluent hypergeometric 1F1(a; 1; z), power series
            let term = cx(1), sum = cx(1);
            for (let n = 0; n < 400; n++) {
                term = cmul(term, cdiv(cmul(cx(a.re + n, a.im), z), cx((n + 1) * (n + 1))));
                sum = cadd(sum, term);
                if (Math.hypot(term.re, term.im) < 1e-14 * Math.hypot(sum.re, sum.im)) break;
            }
            return sum;
        }
        function microF(f) {
            const w = 2 * Math.PI * Math.abs(f) * MICRO_TM, y = MICRO_Y;
            if (w < 1e-6) return cx(1);
            const xm = 0.5 * (y + Math.sqrt(y * y + 4));
            const phim = 0.5 * (xm - y) * (xm - y) - Math.log(xm);
            const pre = cexp(cx(Math.PI * w / 4, 0.5 * w * (Math.log(w / 2) - 2 * phim)));
            return cmul(pre, cmul(cgamma(cx(1, -w / 2)), hyp1f1(cx(0, w / 2), cx(0, w * y * y / 2))));
        }
        function fft(re, im, inverse) {   // in place, radix 2
            const n = re.length;
            for (let i = 1, j = 0; i < n; i++) {
                let bit = n >> 1;
                for (; j & bit; bit >>= 1) j ^= bit;
                j ^= bit;
                if (i < j) { [re[i], re[j]] = [re[j], re[i]]; [im[i], im[j]] = [im[j], im[i]]; }
            }
            for (let len = 2; len <= n; len <<= 1) {
                const ang = 2 * Math.PI / len * (inverse ? 1 : -1), wr = Math.cos(ang), wi = Math.sin(ang);
                for (let i = 0; i < n; i += len) {
                    let cr = 1, ci = 0;
                    for (let k = 0; k < len / 2; k++) {
                        const a = i + k, b = a + len / 2;
                        const xr = re[b] * cr - im[b] * ci, xi = re[b] * ci + im[b] * cr;
                        re[b] = re[a] - xr; im[b] = im[a] - xi;
                        re[a] += xr; im[a] += xi;
                        const t = cr * wr - ci * wi; ci = cr * wi + ci * wr; cr = t;
                    }
                }
            }
            if (inverse) for (let i = 0; i < n; i++) { re[i] /= n; im[i] /= n; }
        }
        // Image 1 after the star: chirp -> FFT -> times F(f) -> inverse FFT (built once, in init)
        const MICRO_N = 1024, MICRO_STEP = 1 / 200;
        let MICRO_T0 = 0, microWave = null;
        function buildMicroWave() {
            MICRO_T0 = -CHIRP_DURATION - 0.8;
            const re = new Float64Array(MICRO_N), im = new Float64Array(MICRO_N);
            for (let k = 0; k < MICRO_N; k++) re[k] = waveform(MICRO_T0 + k * MICRO_STEP, 0);
            fft(re, im, false);
            for (let k = 0; k < MICRO_N; k++) {
                const f = (k <= MICRO_N / 2 ? k : k - MICRO_N) / (MICRO_N * MICRO_STEP);
                const F = microF(f);
                const Fi = f >= 0 ? -F.im : F.im;   // this FFT uses e^(-i 2 pi f t): conjugate for f > 0
                const a = re[k], b = im[k];
                re[k] = a * F.re - b * Fi;
                im[k] = a * Fi + b * F.re;
            }
            fft(re, im, true);
            microWave = Float32Array.from(re);
        }
        function microStrain(tau) {
            const u = (tau - MICRO_T0) / MICRO_STEP;
            if (u < 0 || u >= MICRO_N - 1) return 0;
            const k = Math.floor(u);
            return microWave[k] + (microWave[k + 1] - microWave[k]) * (u - k);
        }
        const microWell = { x: 0, z: 0, radius: 22, depth: 14 };

        const OBSERVER_POS = new THREE.Vector3(X_DISTANCE - 20, GRID_ELEV, 0);
        const D_L = OBSERVER_POS.x;                      // observer-lens distance
        const D_S = OBSERVER_POS.x + (X_DISTANCE - 30);  // observer-source distance
        const SOURCE_POS = new THREE.Vector3(-(X_DISTANCE - 30), GRID_ELEV, 0); // z follows the slider
        const LENS_Y = -5;                                // height of the galaxy / cluster centre

        // --- Waves ---
        const WAVE_SPEED = 260;         // propagation speed far from the lens
        const KAPPA = 4;                // extra slowness deep in the well (cartoon of the Shapiro delay)
        const GRID_WAVE_AMP = 18;       // grid amplitude of the brightest image after the lens
        const GRID_K = 2 * Math.PI / 24; // wavenumber at the merger front; wavelength grows ahead of it
        const GRID_XR = 40;
        const BEAM_RADIUS = 95;
        const SPIRAL_RADIUS = 100;      // quadrupole pattern drawn around the source during the inspiral
        const SPIRAL_AMP = 9;

        // --- Detector waveform: inspiral chirp, merger and ringdown ---
        const F_PEAK = 14;              // GW frequency at merger, in animation Hz
        const F_RING = 1.4 * F_PEAK;    // ringdown frequency
        const CHIRP_DURATION = 1.3;     // frequency sweeps from F_PEAK/4 to F_PEAK in this time
        const CHIRP_TR = CHIRP_DURATION / (Math.pow(4, 8 / 3) - 1);
        const F_TAU = (F_RING - F_PEAK) * CHIRP_TR / (0.375 * F_PEAK); // keeps df/dt continuous at the peak
        const RINGDOWN_TAU = 0.045;

        const GRID_BASE_COLOR = new THREE.Color(0x0077ff);   // Blue grid
        const UNSPLIT_COLOR = new THREE.Color(0xc77dff);     // Wave before it reaches the lens
        const IMAGE_COLORS = [0xff4fd8, 0xffb347, 0x5fe0c0, 0xa6f05a, 0x8fd3ff];
        const MORSE_PHASE = { 1: 0, 2: -Math.PI / 2, 3: -Math.PI };

        // --- Animation cycle timing ---
        const INSPIRAL_DURATION = 3.0;
        const PAUSE_DURATION = 1.5;
        let WAVE_DURATION, CYCLE_DURATION; // set once the paths are known
        let cycleStart = 0;

        // --- Binary: inspiral that speeds up, then a smooth plunge (a = a0 (1 - p^2)) ---
        const BH1_RADIUS = 6, BH2_RADIUS = 5, MERGED_RADIUS = 7;
        const SEP0 = 44, MERGE_SEP = BH1_RADIUS + BH2_RADIUS;
        const OMEGA0 = 4.0, OMEGA_MAX = 24; // Kepler: omega ~ a^(-3/2), capped so the plunge stays fluid
        const ORBIT_STEPS = 2000;
        const orbitPhase = new Float32Array(ORBIT_STEPS + 1);
        for (let k = 1; k <= ORBIT_STEPS; k++) {
            const dt = INSPIRAL_DURATION / ORBIT_STEPS;
            orbitPhase[k] = orbitPhase[k - 1] + 0.5 * dt * (orbitOmega((k - 1) * dt) + orbitOmega(k * dt));
        }
        const PHI_END = orbitPhase[ORBIT_STEPS];

        let images = [];
        let unlensedAmp = 1, strainMax = 1;

        // --- Observer view ---
        let obsTarget = 0, obsBlend = 0, lastElapsed = 0;
        const orbitSaved = { pos: new THREE.Vector3(), target: new THREE.Vector3(), fov: 72 };

        function smoothstep(e0, e1, x) {
            const t = Math.min(1, Math.max(0, (x - e0) / (e1 - e0)));
            return t * t * (3 - 2 * t);
        }

        function orbitSeparation(t) {
            const p = Math.min(1, Math.max(0, t / INSPIRAL_DURATION));
            return SEP0 * (1 - p * p);
        }
        function orbitOmega(t) {
            return Math.min(OMEGA_MAX, OMEGA0 * Math.pow(SEP0 / Math.max(orbitSeparation(t), 1e-3), 1.5));
        }
        function orbitState(t) {
            const x = Math.min(1, Math.max(0, t / INSPIRAL_DURATION)) * ORBIT_STEPS;
            const k = Math.min(ORBIT_STEPS - 1, Math.floor(x));
            return { sep: orbitSeparation(t), phi: orbitPhase[k] + (orbitPhase[k + 1] - orbitPhase[k]) * (x - k) };
        }

        // Detector strain: f ~ (tc - t)^(-3/8) and A ~ f^(2/3) during the inspiral, smooth peak at
        // the merger, then the frequency rises to the ringdown value while the amplitude decays
        const TR_38 = Math.pow(CHIRP_TR, 0.375), TR_58 = Math.pow(CHIRP_TR, 0.625);
        function rawAmp(tau) {
            return Math.pow(Math.max(0, 1 - tau / CHIRP_TR) + Math.exp(4 * tau / RINGDOWN_TAU), -0.25);
        }
        let AMP_NORM = 0;
        for (let tau = -0.2; tau < 0.2; tau += 1e-4) AMP_NORM = Math.max(AMP_NORM, rawAmp(tau));
        function waveAmp(tau) {
            if (tau <= -CHIRP_DURATION) return 0;
            return rawAmp(tau) / AMP_NORM * smoothstep(-CHIRP_DURATION, -CHIRP_DURATION + 0.35, tau);
        }
        function waveform(tau, phase0) {
            const amp = waveAmp(tau);
            if (amp === 0) return 0;
            const phi = tau < 0
                ? -2 * Math.PI * F_PEAK * TR_38 * 1.6 * (Math.pow(CHIRP_TR - tau, 0.625) - TR_58)
                : 2 * Math.PI * (F_RING * tau - (F_RING - F_PEAK) * F_TAU * (1 - Math.exp(-tau / F_TAU)));
            return amp * Math.cos(phi + phase0);
        }

        // The same chirp drawn on the grid, as a function of the distance xi ahead of the merger front
        // (wavelengths stretched so the ripples stay readable)
        function gridWave(xi, phase0) {
            let amp, phi;
            if (xi >= 0) {
                const u = 1 + xi / GRID_XR;
                amp = Math.pow(u, -1 / 8) * (1 - smoothstep(110, 170, xi));
                phi = GRID_K * GRID_XR * 1.6 * (Math.pow(u, 0.625) - 1);
            } else {
                amp = Math.exp(xi / 40);
                phi = 1.4 * GRID_K * xi;
            }
            return amp * Math.cos(phi + phase0);
        }

        function wellHeight(x, z) {
            const d = Math.sqrt(x * x + z * z);
            let h = d < lens.wellRadius ? -lens.wellDepth * 0.5 * (1 + Math.cos(Math.PI * d / lens.wellRadius)) : 0;
            if (microOn) {
                const dm = Math.hypot(x - microWell.x, z - microWell.z);
                if (dm < microWell.radius) h -= microWell.depth * 0.5 * (1 + Math.cos(Math.PI * dm / microWell.radius));
            }
            return h;
        }

        // Large offsets are squeezed so the source and the paths stay on the sheet
        // (the caustics panel shows the true positions)
        function squeeze(v, limit) {
            return limit * Math.tanh(v / limit);
        }

        // Softened isothermal ellipsoid (Keeton 2001) with b = 1, axis ratio q (major axis along x) and core s
        function makeLensModel(q, s) {
            const e = Math.sqrt(Math.max(0, 1 - q * q));
            const deflect = (x, y) => {
                const psi = Math.sqrt(q * q * (s * s + x * x) + y * y);
                if (e < 1e-4) { const d = psi + s; return [x / d, y / d]; }
                return [q / e * Math.atan(e * x / (psi + s)), q / e * Math.atanh(e * y / (psi + q * q * s))];
            };
            const potential = (x, y) => {
                const [ax, ay] = deflect(x, y);
                if (s === 0) return x * ax + y * ay;
                const psi = Math.sqrt(q * q * (s * s + x * x) + y * y);
                return x * ax + y * ay - 0.5 * q * s * Math.log((psi + s) * (psi + s) + (1 - q * q) * x * x);
            };
            const jacobian = (x, y) => {   // A = dy/dx = 1 - d alpha/dx, symmetric
                const h = 1e-5;
                const [a1, b1] = deflect(x + h, y), [a2, b2] = deflect(x - h, y);
                const [a3, b3] = deflect(x, y + h), [a4, b4] = deflect(x, y - h);
                return [1 - (a1 - a2) / (2 * h), -0.25 * ((b1 - b2) + (a3 - a4)) / h, 1 - (b3 - b4) / (2 * h)];
            };
            return { deflect, potential, jacobian, q, s };
        }

        // The image plane is sampled once per lens: where each point maps to on the source plane,
        // and the two eigenvalues of A (tangential 1 - kappa - gamma, radial 1 - kappa + gamma)
        const LGRID_L = 4, LGRID_N = 280;
        function buildLensGrid(model) {
            const n = LGRID_N + 1, h = 2 * LGRID_L / LGRID_N, off = 0.37 * h;   // offset keeps the centre off the nodes
            const G = { n, X: new Float64Array(n * n), Y: new Float64Array(n * n), U: new Float64Array(n * n),
                V: new Float64Array(n * n), LT: new Float64Array(n * n), LR: new Float64Array(n * n), model };
            for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) {
                const k = j * n + i, x = -LGRID_L + i * h + off, y = -LGRID_L + j * h + off;
                const [ax, ay] = model.deflect(x, y);
                G.X[k] = x; G.Y[k] = y; G.U[k] = x - ax; G.V[k] = y - ay;
                const [a, b, d] = model.jacobian(x, y);
                const tr = 0.5 * (a + d), r = Math.sqrt(0.25 * (a - d) * (a - d) + b * b);
                G.LT[k] = tr - r; G.LR[k] = tr + r;
            }
            return G;
        }

        // Images of a source at (y1, y2): grid triangles whose image on the source plane contains the
        // source, refined with Newton's method; sorted by arrival time
        function solveImages(G, y1, y2) {
            const { n, X, Y, U, V, model } = G;
            const inside = (a, b, c) => {
                const d1 = (y1 - U[b]) * (V[a] - V[b]) - (U[a] - U[b]) * (y2 - V[b]);
                const d2 = (y1 - U[c]) * (V[b] - V[c]) - (U[b] - U[c]) * (y2 - V[c]);
                const d3 = (y1 - U[a]) * (V[c] - V[a]) - (U[c] - U[a]) * (y2 - V[a]);
                return !((d1 < 0 || d2 < 0 || d3 < 0) && (d1 > 0 || d2 > 0 || d3 > 0));
            };
            const starts = [];
            for (let j = 0; j < n - 1; j++) for (let i = 0; i < n - 1; i++) {
                const k = j * n + i, k1 = k + 1, k2 = k + n, k3 = k + n + 1;
                if (inside(k, k1, k3)) starts.push([(X[k] + X[k1] + X[k3]) / 3, (Y[k] + Y[k1] + Y[k3]) / 3]);
                if (inside(k, k3, k2)) starts.push([(X[k] + X[k3] + X[k2]) / 3, (Y[k] + Y[k3] + Y[k2]) / 3]);
            }
            const found = [];
            for (let [x, y] of starts) {
                for (let it = 0; it < 30; it++) {
                    const [ax, ay] = model.deflect(x, y);
                    const f1 = x - ax - y1, f2 = y - ay - y2;
                    if (Math.hypot(f1, f2) < 1e-12) break;
                    const [a, b, d] = model.jacobian(x, y), det = a * d - b * b;
                    if (Math.abs(det) < 1e-14) break;
                    let dx = (d * f1 - b * f2) / det, dy = (a * f2 - b * f1) / det;
                    const step = Math.hypot(dx, dy);
                    if (step > 0.2) { dx *= 0.2 / step; dy *= 0.2 / step; }
                    x -= dx; y -= dy;
                }
                const [ax, ay] = model.deflect(x, y);
                if (Math.hypot(x - ax - y1, y - ay - y2) > 1e-7 || Math.hypot(x, y) < 1e-3) continue;
                if (found.some(m => Math.hypot(m.x - x, m.y - y) < 1e-4)) continue;
                const [a, b, d] = model.jacobian(x, y), det = a * d - b * b;
                found.push({ x, y, mu: 1 / det, type: det < 0 ? 2 : (a + d > 0 ? 1 : 3),
                    tau: 0.5 * ((x - y1) * (x - y1) + (y - y2) * (y - y2)) - model.potential(x, y) });
            }
            return found.filter(m => Math.abs(m.mu) > 0.01).sort((a, b) => a.tau - b.tau);
        }

        // Zero contour of a grid field (marching squares), as segments [x1, y1, x2, y2]
        function zeroContour(G, F) {
            const { n, X, Y } = G, segs = [];
            const cross = (a, b) => { const t = F[a] / (F[a] - F[b]); return [X[a] + t * (X[b] - X[a]), Y[a] + t * (Y[b] - Y[a])]; };
            for (let j = 0; j < n - 1; j++) for (let i = 0; i < n - 1; i++) {
                const a = j * n + i, b = a + 1, c = a + n + 1, d = a + n;
                const p = [];
                for (const [u, v] of [[a, b], [b, c], [c, d], [d, a]]) if ((F[u] > 0) !== (F[v] > 0)) p.push(cross(u, v));
                if (p.length >= 2) segs.push([...p[0], ...p[1]]);
                if (p.length === 4) segs.push([...p[2], ...p[3]]);
            }
            return segs;
        }

        // Critical curves (image plane) and caustics (their image on the source plane), once per lens
        let lensModel = null, lensGrid = null, lensCurves = null, lensKey = '';
        function updateLensModel() {
            const key = `${lens.core}|${ellipticity}`;
            if (key === lensKey) return;
            lensKey = key;
            lensModel = makeLensModel(1 - ellipticity, lens.core);
            lensGrid = buildLensGrid(lensModel);
            const map = (x, y) => { const [a, b] = lensModel.deflect(x, y); return [x - a, y - b]; };
            const toSource = (segs) => segs.map(([x1, y1, x2, y2]) => [...map(x1, y1), ...map(x2, y2)]);
            const tCrit = zeroContour(lensGrid, lensGrid.LT), rCrit = zeroContour(lensGrid, lensGrid.LR);
            const C = { tCrit, rCrit, tCaus: toSource(tCrit), rCaus: toSource(rCrit), cut: [], cutSegs: [] };
            C.tSize = 0;
            for (const sg of C.tCaus) C.tSize = Math.max(C.tSize, Math.hypot(sg[0], sg[1]));
            if (lens.core === 0) {
                // the singular lens has no radial caustic but a cut: where the innermost image vanishes into the centre
                for (let k = 0; k <= 180; k++) {
                    const p = 2 * Math.PI * k / 180, [a, b] = lensModel.deflect(1e-7 * Math.cos(p), 1e-7 * Math.sin(p));
                    C.cut.push([-a, -b]);
                }
                for (let k = 1; k < C.cut.length; k++) C.cutSegs.push([...C.cut[k - 1], ...C.cut[k]]);
            }
            lensCurves = C;
        }

        function lensModelName() {
            if (lens === LENSES.galaxy) return ellipticity > 0 ? 'SIE lens' : 'SIS lens';
            return ellipticity > 0 ? 'Cored elliptical cluster' : 'Cored isothermal cluster';
        }

        // --- Scenarios: ready-made configurations, chosen in the menu or opened with ?scenario=<id> ---
        // y: source position in units of theta_E; e: lens ellipticity (1 - axis ratio); phi: direction of
        // the source on the sky, in degrees. Magnifications and delays quoted in the texts come from the
        // lens model above (delays for z_L = 0.5, z_S = 2, see DAYS_PER_TAU).
        const MI = (s) => `<span class="mi">${s}</span>`;   // maths, italic (Computer Modern)
        const MU = (s) => `<span class="mu">${s}</span>`;   // maths, upright
        const MU_ = MI('μ'), HALF_PI = MU('−') + MI('π') + MU('/2'), FULL_PI = MU('−') + MI('π');
        const approx = (v) => MU(` ≈ ${v}`);
        const SCENARIOS = [
            {

            },
            {

            },
            {
                id: 'cluster', group: 'Strong lensing', name: 'Galaxy cluster: years apart',

                text: `A cluster has a much larger Einstein radius than a galaxy, so its images arrive months to years apart (here about 12 years between the first two). Its flat core adds a third, very faint image at the centre: a maximum of the arrival time, with its phase shifted by ${FULL_PI}.`,

            },
            {
                id: 'cluster-five', group: 'Strong lensing', name: 'Elliptical cluster: five images',

                look: 'Compare the chirp with the dashed signal without the lens: same shape, slightly larger.',

                look: 'Compare image 1 with its dashed copy without the star. The effect is exaggerated here: at detector frequencies it is strongest for lenses of tens to thousands of solar masses.',
            },

                lens: 'galaxy', y: 0.05, e: 0.3, phi: 35, micro: true,

            },
        ];
        const DEFAULT_SCENARIO = 'two-images';

        function scenarioOptions() {
            let html = '<option value="custom">Custom settings</option>';
            for (const group of [...new Set(SCENARIOS.map(s => s.group))]) {
                html += `<optgroup label="${group}">`;
                for (const s of SCENARIOS.filter(sc => sc.group === group)) html += `<option value="${s.id}">${s.name}</option>`;
                html += '</optgroup>';
            }
            return html;
        }

        function setLens(name) {
            lens = LENSES[name];
            document.getElementById('btnLens').textContent = lens === LENSES.galaxy ? 'Switch to cluster' : 'Switch to galaxy';
        }
        function setMicro(on) {
            microOn = on;
            document.getElementById('btnMicro').classList.toggle('on', microOn);
        }
        function setSource(y, e, phi) {   // phi in radians
            sourceY = y; ellipticity = e; sourcePhi = phi;
            document.getElementById('yslider').value = y;
            document.getElementById('eslider').value = e;
        }

        function applyScenario(id) {
            const s = SCENARIOS.find(sc => sc.id === id);
            if (!s) return;
            activeScenario = s;
            document.getElementById('scenario').value = s.id;
            setLens(s.lens);
            setMicro(!!s.micro);
            setSource(s.y, s.e, s.phi * Math.PI / 180);
            buildLensScene();   // also restarts the cycle and rewrites the explanation
        }
        // Any manual change (sliders, buttons, dragging the source) leaves the preset
        function leaveScenario() {
            activeScenario = null;
            document.getElementById('scenario').value = 'custom';
            updateInfo();
        }

        // Explanation box: the preset's text, or a description of whatever the current settings give
        function updateInfo() {
            let head, text, look;
            if (activeScenario) {
                ({ name: head, text, look } = activeScenario);
            } else {
                const n = images.length;
                if (n > 1) {
                    head = `Strong lensing: ${n} images`;
                    text = `The source is close enough to the line of sight to the lens to have ${n} images. The detector receives ${n} copies of the same chirp, with different magnifications ${MU_}, arrival times and phases (0 for minima, ${HALF_PI} for saddle points, ${FULL_PI} for maxima).`;
                } else if (images[0].mu > 1.6) {
                    head = 'One image, still close to the lens';
                    text = 'The source is just outside the region where the lens forms several images, so its only image is still clearly magnified.';
                } else {
                    head = 'Weak lensing: one image';
                    text = `A single, mildly magnified image. On its own it looks like an unlensed signal from a slightly closer source: the distance inferred from its amplitude is ${MI('D')}<sub>L</sub>/√${MU_}.`;
                }
                if (microOn) text += ' A star next to image 1 adds microlensing: a frequency-dependent distortion of that copy (wave optics).';
                look = 'Drag the source in the top-right panel: the number of images changes when it crosses a red curve.';
            }
            document.getElementById('info').innerHTML =
                `<div class="head"><span class="tog"></span>${head}</div><div class="body">${text}</div>` + (look ? `<div class="look">${look}</div>` : '');
            layoutInfo();
        }

        // The explanation sits at the top, between the controls and the caustics panel (it widens when
        // either is hidden); when there is no room for it there, it goes under the controls
        function layoutInfo() {
            const info = document.getElementById('info');
            if (info.style.display === 'none') return;
            const W = window.innerWidth, gap = W > 760 ? 16 : 8;
            const ui = document.getElementById('ui'), cp = document.getElementById('caustics');
            const uiR = ui.style.display !== 'none' ? ui.getBoundingClientRect() : null;
            const cpR = cp.style.display !== 'none' ? cp.getBoundingClientRect() : null;
            const cpTop = cpR && cpR.top < 100;   // the caustics panel is at the top (not on small screens)
            const left = (uiR ? uiR.right : 0) + gap, right = (cpTop ? cpR.left : W) - gap;
            const avail = right - left;
            if (avail >= 340) {
                const w = Math.min(avail, 620);
                Object.assign(info.style, { left: `${left + (avail - w) / 2}px`, top: `${gap}px`, width: `${w}px` });
            } else {
                Object.assign(info.style, { left: `${gap}px`, top: `${(uiR ? uiR.bottom : 0) + gap / 2}px`,
                    width: `${Math.min(uiR ? Math.max(uiR.width, 340) : 420, W - 2 * gap)}px` });
            }
        }

        // Links that reopen the current configuration: ?scenario=<id>, or the settings themselves
        // (?lens=cluster&y=0.3&e=0.2&phi=30&micro=1), plus view=observer, ui=0, info=0, caustics=0, waveform=0
        function currentQuery() {
            const q = new URLSearchParams();
            if (activeScenario) {
                q.set('scenario', activeScenario.id);
            } else {
                q.set('lens', lens === LENSES.galaxy ? 'galaxy' : 'cluster');
                q.set('y', sourceY.toFixed(2));
                q.set('e', ellipticity.toFixed(2));
                q.set('phi', String(Math.round(sourcePhi * 180 / Math.PI)));
                if (microOn) q.set('micro', '1');
            }
            if (obsTarget) q.set('view', 'observer');
            return q.toString();
        }
        function copyLink(btn) {
            const url = window.location.href.split(/[?#]/)[0] + '?' + currentQuery();
            const done = () => { btn.textContent = 'Copied'; setTimeout(() => { btn.textContent = 'Copy link'; }, 1500); };
            const ask = () => { try { window.prompt('Link to this configuration:', url); } catch (err) { /* blocked in some frames */ } };
            if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(url).then(done, ask);
            else ask();
        }
        function applyUrlParams() {
            const q = new URLSearchParams(window.location.search);
            const num = (k, lo, hi, d) => { const v = parseFloat(q.get(k)); return Number.isFinite(v) ? Math.min(hi, Math.max(lo, v)) : d; };
            if (SCENARIOS.some(s => s.id === q.get('scenario'))) {
                applyScenario(q.get('scenario'));
            } else if (['lens', 'y', 'e', 'phi', 'micro'].some(k => q.has(k))) {
                setLens(q.get('lens') === 'cluster' ? 'cluster' : 'galaxy');
                setMicro(q.get('micro') === '1');
                setSource(num('y', 0, Y_MAX, sourceY), num('e', 0, 0.5, ellipticity), num('phi', -360, 360, 0) * Math.PI / 180);
                leaveScenario();
                buildLensScene();
            } else {
                applyScenario(DEFAULT_SCENARIO);
            }
            if (q.get('view') === 'observer') toggleObserver();
            for (const [key, id] of [['caustics', 'caustics'], ['waveform', 'hpanel'], ['info', 'info'], ['ui', 'ui']]) {
                if (q.get(key) === '0') togglePanel(id);
            }
        }

        function setPaused(p) {
            paused = p;
            updateRegime();
        }
        let regimeText = '';
        function updateRegime() {
            document.getElementById('regime').textContent = regimeText + (paused ? '  (paused)' : '');
        }

        // Portrait screens (phones) see less of the scene sideways: the camera starts further away
        function portraitZoom() {
            const aspect = window.innerWidth / window.innerHeight;
            return aspect < 1 ? Math.min(2.2, 1 / aspect) : 1;
        }

        // --- Initialization ---
        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000);

            camera = new THREE.PerspectiveCamera(72, window.innerWidth / window.innerHeight, 0.1, 2000);
            camera.position.set(0, 180, 280).multiplyScalar(portraitZoom());

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.target.set(0, 0, 0);

            controls.autoRotate = true;
            controls.autoRotateSpeed = -1.5;

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);
            const directionalLight = new THREE.DirectionalLight(0xffffff, 1.0);
            directionalLight.position.set(100, 200, 150);
            scene.add(directionalLight);

            // Latin Modern Roman 10 (the LaTeX font), converted to a three.js typeface
            font = new FontLoader().parse(LM_ROMAN_TYPEFACE);
            buildMicroWave();
            createSceneObjects();
            buildLensScene();
            animate();

            window.addEventListener('resize', onWindowResize);
            window.addEventListener('keydown', (e) => {
                if (e.repeat || e.ctrlKey || e.metaKey || e.altKey) return;   // a held key toggles only once
                if (e.target.tagName === 'SELECT') return;                       // keys used by the scenario menu
                const k = e.key.toLowerCase();
                if (k === 'h') {
                    togglePanel('hpanel');
                } else if (k === 'c') {
                    toggleLens();
                    leaveScenario();
                } else if (k === 'o') {
                    toggleObserver();
                } else if (k === 'm') {
                    toggleMicro();
                    leaveScenario();
                } else if (k === 'k') {
                    togglePanel('caustics');
                } else if (k === ' ') {
                    e.preventDefault();
                    setPaused(!paused);
                } else if (k === 'r') {
                    cycleStart = simTime;   // replay from the start of the inspiral
                } else if (k === 'i') {
                    togglePanel('info');
                } else if (k === 'u') {
                    togglePanel('ui');
                }
            });
            document.getElementById('yslider').addEventListener('input', (e) => {
                sourceY = parseFloat(e.target.value);
                leaveScenario();
                buildLensScene();
            });
            document.getElementById('eslider').addEventListener('input', (e) => {
                ellipticity = parseFloat(e.target.value);
                leaveScenario();
                buildLensScene();
            });
            document.getElementById('btnLens').addEventListener('click', (e) => { toggleLens(); leaveScenario(); e.target.blur(); });
            document.getElementById('btnObs').addEventListener('click', (e) => { toggleObserver(); e.target.blur(); });
            document.getElementById('btnMicro').addEventListener('click', (e) => { toggleMicro(); leaveScenario(); e.target.blur(); });
            document.getElementById('btnCaustics').addEventListener('click', (e) => { togglePanel('caustics'); e.target.blur(); });
            document.getElementById('btnWave').addEventListener('click', (e) => { togglePanel('hpanel'); e.target.blur(); });
            document.getElementById('btnLink').addEventListener('click', (e) => { copyLink(e.target); e.target.blur(); });
            const menu = document.getElementById('scenario');
            menu.innerHTML = scenarioOptions();
            menu.addEventListener('change', (e) => {
                if (e.target.value === 'custom') leaveScenario();
                else applyScenario(e.target.value);
                e.target.blur();
            });
            setupCausticsPanel();
            resizePanel();
            applyUrlParams();
            const info = document.getElementById('info');
            info.addEventListener('click', (e) => { if (e.target.closest('.head')) info.classList.toggle('collapsed'); });
            if (window.innerWidth <= 760) info.classList.add('collapsed');   // phones: just the title, tap to open
            document.fonts.ready.then(layoutInfo);

            window.__sim = { camera, controls, toggleLens, toggleObserver, toggleMicro, applyScenario, setPaused,
                setY: (y) => { sourceY = y; document.getElementById('yslider').value = y; buildLensScene(); },
                setE: (e) => { ellipticity = e; document.getElementById('eslider').value = e; buildLensScene(); },
                setPhi: (p) => { sourcePhi = p; buildLensScene(); },
                setTime: (t) => { simTime = cycleStart + t; },   // time within the cycle, for recordings
                scenarios: SCENARIOS.map(s => s.id), get scenario() { return activeScenario ? activeScenario.id : 'custom'; },
                get images() { return images; }, get curves() { return lensCurves; }, get cycle() { return CYCLE_DURATION; } };
        }

        function toggleLens() {
            setLens(lens === LENSES.galaxy ? 'cluster' : 'galaxy');
            buildLensScene();
        }

        function toggleMicro() {
            setMicro(!microOn);
            buildLensScene();
        }

        // Caustics panel (K or its button), waveform panel (H or its button), explanation (I), controls (U)
        function togglePanel(id) {
            const p = document.getElementById(id);
            const hide = p.style.display !== 'none';
            p.style.display = hide ? 'none' : '';
            const btn = { caustics: 'btnCaustics', hpanel: 'btnWave' }[id];
            if (btn) document.getElementById(btn).textContent = `${hide ? 'Show' : 'Hide'} ${id === 'caustics' ? 'caustics' : 'waveform'}`;
            if (!hide && id === 'hpanel') resizePanel();
            layoutInfo();
        }

        function toggleObserver() {
            if (obsTarget === 0 && obsBlend === 0) {
                orbitSaved.pos.copy(camera.position);
                orbitSaved.target.copy(controls.target);
                orbitSaved.fov = camera.fov;
            }
            obsTarget = 1 - obsTarget;
            controls.enabled = false;
            controls.autoRotate = false;
            document.getElementById('btnObs').textContent = obsTarget ? 'Back to orbit' : 'Observer view';
            const info = document.getElementById('info');
            if (obsTarget) {
                infoFoldedByView = !info.classList.contains('collapsed');
                info.classList.add('collapsed');
