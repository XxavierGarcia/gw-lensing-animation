        }

        function createSceneObjects() {
            createStarfield();
            createSpacetimeGrid();
            galaxyGroup = createEllipticalGalaxy(1.0);
            galaxyGroup.position.set(0, LENS_Y, 0);
            scene.add(galaxyGroup);
            createCluster();
            createBBHSource();
            createDetector();
            createSkyImages();
            createMicroStar();
            detectorLabel = makeText("Detector", OBSERVER_POS.clone().add(new THREE.Vector3(0, 20, 0)));
            textLabels.push(detectorLabel);
        }

        function createStarfield() {
            const starVertices = [];
            for (let i = 0; i < 10000; i++) {
                const x = THREE.MathUtils.randFloatSpread(2000);
                const y = THREE.MathUtils.randFloatSpread(2000);
                const z = THREE.MathUtils.randFloatSpread(2000);
                starVertices.push(x, y, z);
            }
            const starGeometry = new THREE.BufferGeometry();
            starGeometry.setAttribute('position', new THREE.Float32BufferAttribute(starVertices, 3));
            const starMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 0.85, map: makeStarTexture(), transparent: true, depthWrite: false });
            const starfield = new THREE.Points(starGeometry, starMaterial);
            scene.add(starfield);
        }

        // A small soft disc, so the nearby stars look like points of light rather than squares
        function makeStarTexture() {
            const c = document.createElement('canvas');
            c.width = c.height = 32;
            const g = c.getContext('2d');
            const grad = g.createRadialGradient(16, 16, 0, 16, 16, 16);
            grad.addColorStop(0, 'rgba(255,255,255,1)');
            grad.addColorStop(0.45, 'rgba(255,255,255,0.9)');
            grad.addColorStop(1, 'rgba(255,255,255,0)');
            g.fillStyle = grad;
            g.fillRect(0, 0, 32, 32);
            return new THREE.CanvasTexture(c);
        }

        function createSpacetimeGrid() {
            const geometry = new THREE.PlaneGeometry(GRID_SIZE, GRID_SIZE, GRID_SEGMENTS, GRID_SEGMENTS);
            const material = new THREE.MeshBasicMaterial({
                wireframe: true,
                vertexColors: true,
                transparent: true,
                opacity: 0.5
            });
            spacetimePlane = new THREE.Mesh(geometry, material);
            spacetimePlane.rotation.x = -Math.PI / 2; // local (x, y, z) -> world (x, z, -y)
            scene.add(spacetimePlane);
            staticVertices = new Float32Array(geometry.attributes.position.array.length);
            geometry.setAttribute('color', new THREE.BufferAttribute(new Float32Array(staticVertices.length), 3));
            applyWell();
        }

        function applyWell() {
            const vertices = spacetimePlane.geometry.attributes.position;
            for (let i = 0; i < vertices.count; i++) {
                vertices.setZ(i, wellHeight(vertices.getX(i), -vertices.getY(i)));
            }
            staticVertices.set(vertices.array);
        }

        const glowTexture = new THREE.CanvasTexture(generateGlowTexture());

        // Diffuse starlight: de Vaucouleurs r^(1/4) profile with elliptical isophotes,
        // drawn on a quad that always faces the camera
        function makeLightQuad(size, o) {
            const quad = new THREE.Mesh(new THREE.PlaneGeometry(size, size), new THREE.ShaderMaterial({
                uniforms: {
                    axisRatio: { value: o.axisRatio ?? 0.72 },
                    posAngle: { value: o.posAngle ?? 0.3 },
                    effRadius: { value: o.effRadius ?? 0.19 },
                    gain: { value: o.gain ?? 1.0 },
                    cCore: { value: new THREE.Color(o.core ?? 0xfff6e8) },
                    cMid: { value: new THREE.Color(o.mid ?? 0xffd29a) },
                    cOut: { value: new THREE.Color(o.out ?? 0xd97a45) },
                },
                vertexShader: `
                    varying vec2 vUv;
                    void main() {
                        vUv = uv;
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }`,
                fragmentShader: `
                    uniform float axisRatio, posAngle, effRadius, gain;
                    uniform vec3 cCore, cMid, cOut;
                    varying vec2 vUv;
                    void main() {
                        vec2 p = (vUv - 0.5) * 2.0;
                        float c = cos(posAngle), s = sin(posAngle);
                        vec2 q = vec2(c * p.x + s * p.y, -s * p.x + c * p.y);
                        float R = length(vec2(q.x, q.y / axisRatio));
                        float I = exp(-7.669 * (pow(max(R / effRadius, 1e-4), 0.25) - 1.0));
                        float L = 1.0 - exp(-0.6 * gain * I);
                        vec3 col = mix(cOut, cMid, smoothstep(0.0, 0.5, L));
                        col = mix(col, cCore, smoothstep(0.55, 1.0, L));
                        float edge = 1.0 - smoothstep(0.8, 1.0, length(p));
                        gl_FragColor = vec4(col, L * edge);
                    }`,
                transparent: true,
                depthWrite: false,
            }));
            quad.renderOrder = 1;
            billboards.push(quad);
            return quad;
        }

        function randomDirection() {
            const theta = Math.random() * 2 * Math.PI;
            const cosPhi = 2 * Math.random() - 1;
            const sinPhi = Math.sqrt(1 - cosPhi * cosPhi);
            return [sinPhi * Math.cos(theta), cosPhi, sinPhi * Math.sin(theta)];
        }

        function createEllipticalGalaxy(scale) {
            // Massive elliptical: old red-yellow stars, Hernquist light profile (bright core,
            // extended faint envelope), triaxial shape, globular clusters, faint dark-matter halo
            const group = new THREE.Group();
            const body = new THREE.Group();
            body.rotation.set(0.25, 0, 0.3);
            group.add(body);

            const starCount = 40000;
            const a = 9 * scale;                 // Hernquist scale radius
            const rMax = 60 * scale;
            const uMax = Math.pow(rMax / (rMax + a), 2);
            const axes = [1.0, 0.68, 0.82];
            const colorCore = new THREE.Color(0xfff4e6);
            const colorMid = new THREE.Color(0xffd6a0);
            const colorOuter = new THREE.Color(0xffa070);
            const positions = new Float32Array(starCount * 3);
            const colors = new Float32Array(starCount * 3);
            const c = new THREE.Color();
            for (let i = 0; i < starCount; i++) {
                // Inverse of the Hernquist enclosed mass M(<r) = r^2 / (r + a)^2
                const su = Math.sqrt(Math.random() * uMax);
                const r = a * su / (1 - su);
                const d = randomDirection();
                positions[3 * i] = r * d[0] * axes[0];
                positions[3 * i + 1] = r * d[1] * axes[1];
                positions[3 * i + 2] = r * d[2] * axes[2];

                const t = Math.min(1, r / (35 * scale));
                if (t < 0.4) c.copy(colorCore).lerp(colorMid, t / 0.4);
                else c.copy(colorMid).lerp(colorOuter, (t - 0.4) / 0.6);
                const brightness = 0.7 + 0.3 * Math.random();
                colors[3 * i] = c.r * brightness;
                colors[3 * i + 1] = c.g * brightness;
                colors[3 * i + 2] = c.b * brightness;
            }
            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            body.add(new THREE.Points(geometry, new THREE.PointsMaterial({
                size: 1.3, map: glowTexture, vertexColors: true, blending: THREE.AdditiveBlending,
                transparent: true, depthWrite: false, opacity: 0.22
            })));

            // Globular clusters orbiting in the halo
            const gcPositions = [];
            for (let k = 0; k < 16; k++) {
                const r = (32 + Math.random() * 40) * scale;
                const d = randomDirection();
                const cx = r * d[0], cy = r * d[1] * 0.8, cz = r * d[2];
                for (let j = 0; j < 40; j++) {
                    gcPositions.push(cx + THREE.MathUtils.randFloatSpread(2.2), cy + THREE.MathUtils.randFloatSpread(2.2), cz + THREE.MathUtils.randFloatSpread(2.2));
                }
            }
            const gcGeometry = new THREE.BufferGeometry();
            gcGeometry.setAttribute('position', new THREE.Float32BufferAttribute(gcPositions, 3));
            body.add(new THREE.Points(gcGeometry, new THREE.PointsMaterial({
                size: 1.0, map: glowTexture, color: 0xffe2b8, blending: THREE.AdditiveBlending,
                transparent: true, depthWrite: false, opacity: 0.6
            })));

            // Dark-matter halo: isothermal (rho ~ 1/r^2, i.e. uniform in r), what the SIS model describes
            group.add(makeHalo(6000, 10, 105 * scale, 0.12));
            group.add(makeLightQuad(200 * scale, {}));
            return group;
        }

        function makeHalo(count, rMin, rMax, opacity) {
            const haloPositions = [];
            for (let k = 0; k < count; k++) {
                const r = rMin + Math.random() * (rMax - rMin);
                const d = randomDirection();
                haloPositions.push(r * d[0], r * d[1] * 0.85, r * d[2]);
            }
            const haloGeometry = new THREE.BufferGeometry();
            haloGeometry.setAttribute('position', new THREE.Float32BufferAttribute(haloPositions, 3));
            return new THREE.Points(haloGeometry, new THREE.PointsMaterial({
                size: 1.6, map: glowTexture, color: 0x7f73ff, blending: THREE.AdditiveBlending,
                transparent: true, depthWrite: false, opacity
            }));
        }

        // Galaxy cluster: brightest cluster galaxy in the centre, dozens of member galaxies
        // (mostly red ellipticals, a few blue spirals), faint intracluster light and a big dark halo
        function createCluster() {
            clusterGroup = new THREE.Group();
            const bcg = createEllipticalGalaxy(1.15);
            clusterGroup.add(bcg);
            clusterGroup.add(makeHalo(9000, 15, 175, 0.1));
            clusterGroup.add(makeLightQuad(420, { effRadius: 0.32, gain: 0.08, axisRatio: 0.8, core: 0xffe7c8, mid: 0xffc890, out: 0xb06a40 }));
            for (let k = 0; k < 38; k++) {
                const r = 45 + Math.pow(Math.random(), 0.8) * 125;
                const ang = Math.random() * 2 * Math.PI;
                const pos = new THREE.Vector3(r * Math.cos(ang), 8 + Math.random() * 45, r * Math.sin(ang));
                const blue = Math.random() < 0.15;
                const size = 18 + Math.random() * 26;
                const member = new THREE.Group();
                member.position.copy(pos);
                member.add(makeLightQuad(size, {
                    effRadius: 0.16 + Math.random() * 0.06, axisRatio: 0.45 + Math.random() * 0.5, posAngle: Math.random() * Math.PI,
                    gain: 0.6 + Math.random() * 0.6,
                    core: blue ? 0xf2f4ff : 0xfff2e0, mid: blue ? 0xbcd0ff : 0xffcf95, out: blue ? 0x6d86d9 : 0xd27a45,
                }));
                clusterGroup.add(member);
            }
            clusterGroup.position.set(0, LENS_Y, 0);
            clusterGroup.visible = false;
            scene.add(clusterGroup);
        }

        function createBBHSource() {
            const bhMaterial = new THREE.MeshPhongMaterial({
                color: 0x000000,
                shininess: 80,
                emissive: 0x111155,
                specular: 0xaaaaee
            });
            bh1 = new THREE.Mesh(new THREE.SphereGeometry(BH1_RADIUS, 32, 32), bhMaterial);
            bh2 = new THREE.Mesh(new THREE.SphereGeometry(BH2_RADIUS, 32, 32), bhMaterial);
            mergedBH = new THREE.Mesh(new THREE.SphereGeometry(MERGED_RADIUS, 32, 32), bhMaterial);
            mergeFlash = new THREE.Sprite(new THREE.SpriteMaterial({
                map: glowTexture, color: 0xb8d0ff,
                blending: THREE.AdditiveBlending, transparent: true, depthWrite: false, opacity: 0
            }));
            mergeFlash.scale.set(45, 45, 1);

            sourceGroup = new THREE.Group();
            sourceGroup.add(bh1, bh2, mergedBH, mergeFlash);
            scene.add(sourceGroup);
        }

        function createDetector() {
            detector = new THREE.Group();
            const baseMat = new THREE.MeshPhongMaterial({ color: 0xcccccc, shininess: 80 });
            const building = new THREE.Mesh(new THREE.BoxGeometry(8, 4, 8), baseMat);
            detector.add(building);
            const armGeo = new THREE.CylinderGeometry(0.8, 0.8, 30, 8);

            detectorArm1 = new THREE.Mesh(armGeo, baseMat);
            detectorArm1.rotation.z = Math.PI / 2;
            detectorArm1.position.x = 15;
            detector.add(detectorArm1);

            detectorArm2 = new THREE.Mesh(armGeo, baseMat);
            detectorArm2.rotation.x = Math.PI / 2;
            detectorArm2.position.z = 15;
            detector.add(detectorArm2);

            detector.position.copy(OBSERVER_POS);
            detector.rotation.y = -Math.PI / 2;
            scene.add(detector);
        }

        function createMicroStar() {
            microStar = new THREE.Sprite(new THREE.SpriteMaterial({
                map: glowTexture, color: 0xe4ecff, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false
            }));
            microStar.scale.set(9, 9, 1);
            microStar.visible = false;
            scene.add(microStar);
        }

        function createSkyImages() {
            for (let k = 0; k < IMAGE_COLORS.length; k++) {
                const s = new THREE.Sprite(new THREE.SpriteMaterial({
                    map: glowTexture, color: IMAGE_COLORS[k], blending: THREE.AdditiveBlending,
                    transparent: true, depthWrite: false, depthTest: false, opacity: 0
                }));
                s.renderOrder = 10;
                s.visible = false;
                scene.add(s);
                skyImages.push(s);
            }
        }

        function makeText(text, position, size = 10, color = 0xffffff) {
            const textGeo = new TextGeometry(text, { font: font, size: size, height: 0.5 });
            const textMesh = new THREE.Mesh(textGeo, new THREE.MeshBasicMaterial({ color }));
            textMesh.position.copy(position);
            textMesh.geometry.center();
            scene.add(textMesh);
            return textMesh;
        }

        // Rebuilds everything that depends on the lens and the source position: images, paths,
        // timings, labels, ring and the observer's view
        function buildLensScene() {
            const yEff = Math.max(sourceY, 0.01);
            SOURCE_POS.z = squeeze(sourceY * lens.thetaE * D_S / D_L, 125);
            sourceGroup.position.copy(SOURCE_POS);
            galaxyGroup.visible = lens === LENSES.galaxy;
            clusterGroup.visible = lens === LENSES.cluster;

            updateLensModel();
            const ux = Math.cos(sourcePhi), uy = Math.sin(sourcePhi);
            const found = solveImages(lensGrid, yEff * ux, yEff * uy).slice(0, IMAGE_COLORS.length);
            if (!found.length) found.push({ x: yEff * ux, y: yEff * uy, mu: 1, type: 1, tau: 0 });   // never expected
            const muFirst = Math.abs(found[0].mu);
            images = found.map((m, k) => {
                const r = Math.hypot(m.x, m.y);
                const along = m.x * ux + m.y * uy, across = -m.x * uy + m.y * ux;   // relative to the source direction
                // The sheet only shows one direction across the line of sight: each image goes to the side
                // it is on, and images off to the sides of the source direction are shared between the two
                const side = Math.abs(along) >= Math.abs(across) ? Math.sign(along) : Math.sign(across);
                return {
                    label: `Image ${k + 1}`, p1: m.x, p2: m.y, r, along, across, side,
                    zRaw: side * r * lens.thetaE, mu: Math.abs(m.mu), tau: m.tau, type: m.type,
                    micro: microOn && k === 0,
                    amp: Math.sqrt(Math.abs(m.mu) / muFirst), phase: MORSE_PHASE[m.type],
                    color: new THREE.Color(IMAGE_COLORS[k]), css: '#' + IMAGE_COLORS[k].toString(16).padStart(6, '0'),
                };
            });
            // paths on the same side of the sheet are kept a little apart so each one stays visible
            for (const side of [-1, 1]) {
                const group = images.filter(m => m.side === side).sort((a, b) => Math.abs(a.zRaw) - Math.abs(b.zRaw));
                let last = -Infinity;
                for (const [rank, m] of group.entries()) {
                    m.rank = rank;
                    const a = Math.max(Math.abs(m.zRaw), last + 18);
                    m.z = squeeze(side * a, 165);
                    last = a;
                }
            }
            unlensedAmp = Math.max(0.25, 1 / Math.sqrt(muFirst));

            for (const obj of [...pathLines, ...lensLabels]) {
                scene.remove(obj);
                obj.geometry.dispose();
                const i = textLabels.indexOf(obj);
                if (i >= 0) textLabels.splice(i, 1);
            }
            pathLines = [];
            lensLabels = [];

            // The star sits in the lens, just beside the path of image 1, and dents the sheet locally
            microWell.z = images[0].z + Math.sign(images[0].z || 1) * 10;
            applyWell();
            microStar.visible = microOn;
            if (microOn) microStar.position.set(0, wellHeight(0, microWell.z) + GRID_ELEV + 4, microWell.z);

            createWavePaths();

            lensLabels.push(makeText("Source (BBH Merger)", SOURCE_POS.clone().add(new THREE.Vector3(0, 20, 0))));
            lensLabels.push(makeText(lens.name, new THREE.Vector3(0, lens.labelY, 0)));
            for (const img of images) lensLabels.push(makeText(img.label, img.labelPos, 8.5, img.color.getHex()));
            if (microOn) lensLabels.push(makeText("Star (microlens)", microStar.position.clone().add(new THREE.Vector3(0, 12, 0)), 6.5, 0xe4ecff));
            textLabels.push(...lensLabels);

            skyImages.forEach((s, k) => {
                const img = images[k];
                s.visible = !!img;
                if (img) {
                    // the observer sees the true 2D pattern (e.g. a cross), rotated so the source side is on the left
                    const k = squeeze(img.r * lens.thetaE, 165) / Math.max(1e-6, img.r * lens.thetaE);
                    s.position.set(0, LENS_Y - img.across * lens.thetaE * k, img.along * lens.thetaE * k);
                    const size = 10 + 14 * Math.sqrt(img.amp);
                    s.scale.set(size, size, 1);
                }
            });

            const yv = document.getElementById('yval');
            yv.innerHTML = `<span class="mi">y</span><span class="mu"> = ${sourceY.toFixed(2)}</span>`;
            document.getElementById('eval').innerHTML = `<span class="mi">ε</span><span class="mu"> = ${ellipticity.toFixed(2)}</span>`;
            // strong: several images; weak: one image, only mildly magnified; in between, one image near the lens
            const regime = images.length > 1 ? `Strong lensing, ${images.length} images`
                : images[0].mu > 1.6 ? 'One image, still close to the lens' : 'Weak lensing, one image';
            regimeText = regime + (microOn ? ', plus microlensing' : '');
            updateRegime();
            updateInfo();
            cycleStart = simTime;
        }

        // Each image follows the sheet. The arrival times come from the lens model
        // (delayScale seconds per unit of tau); the extra delay is spent where the path is deep in
        // the well, so the wave visibly slows there (cartoon of the Shapiro delay).
        function createWavePaths() {
            const N = 400;
            for (const img of images) {
                const plan = new THREE.CatmullRomCurve3([
                    new THREE.Vector3(SOURCE_POS.x, 0, SOURCE_POS.z),
                    new THREE.Vector3(0, 0, img.z),
                    new THREE.Vector3(OBSERVER_POS.x, 0, OBSERVER_POS.z),
                ], false, 'centripetal');
                const pts = plan.getSpacedPoints(N);
                for (const p of pts) p.y = wellHeight(p.x, p.z) + GRID_ELEV;
                img.pts = pts;
                img.s = new Float32Array(N + 1);
                img.t = new Float32Array(N + 1);
                img.w = new Float32Array(N + 1);  // cumulative weight where the extra delay goes
                img.sLens = 0;
                for (let k = 1; k <= N; k++) {
                    const ds = pts[k].distanceTo(pts[k - 1]);
                    img.s[k] = img.s[k - 1] + ds;
                    const depth = -0.5 * (wellHeight(pts[k].x, pts[k].z) + wellHeight(pts[k - 1].x, pts[k - 1].z)) / lens.wellDepth;
                    const xm = 0.5 * (pts[k].x + pts[k - 1].x);
                    img.t[k] = img.t[k - 1] + ds * (1 + KAPPA * depth) / WAVE_SPEED;
                    img.w[k] = img.w[k - 1] + ds * (depth + 0.03 * Math.exp(-(xm / 70) * (xm / 70)));
                    if (pts[k - 1].x < 0 && pts[k].x >= 0) img.sLens = img.s[k];
                }
                img.length = img.s[N];
                const kLabel = pts.findIndex(p => p.x > 45 + 38 * (img.rank || 0));
                img.labelPos = pts[kLabel].clone().add(new THREE.Vector3(0, 13, 0));

                const lineGeo = new THREE.BufferGeometry().setFromPoints(pts);
                const line = new THREE.Line(lineGeo, new THREE.LineDashedMaterial({
                    color: img.color, dashSize: 5, gapSize: 5, transparent: true, opacity: 0.6
                }));
                line.computeLineDistances();
                scene.add(line);
                pathLines.push(line);
            }

            // Arrival times: T_i - T_(i-1) = delayScale (tau_i - tau_(i-1)), but at least MIN_GAP so every chirp
            // can be seen on its own (real delays, hours to years, are always much longer than the chirp);
            // never earlier than the path allows
            const MIN_GAP = CHIRP_DURATION + 0.2;
            images.forEach((img, k) => {
                img.offset = k ? images[k - 1].offset + Math.max(MIN_GAP, lens.delayScale * (img.tau - images[k - 1].tau)) : 0;
            });
            let tRef = 0;
            for (const img of images) tRef = Math.max(tRef, img.t[N] - img.offset);
            for (const img of images) {
                const extra = tRef + img.offset - img.t[N];
                const W = img.w[N];
                for (let k = 1; k <= N; k++) img.t[k] += extra * img.w[k] / W;
                img.T = img.t[N];  // arrival time at the detector, counted from the merger
            }
            const last = images[images.length - 1];
            WAVE_DURATION = last.T + 0.5;
            CYCLE_DURATION = INSPIRAL_DURATION + WAVE_DURATION + PAUSE_DURATION;

            strainMax = 1;
            for (let t = images[0].T - CHIRP_DURATION; t < last.T + 0.3; t += 0.002) strainMax = Math.max(strainMax, Math.abs(detectorStrain(t)));
        }

        function headState(img, tau) {
            const t = img.t, n = t.length - 1;
            if (tau <= 0) return { x: img.pts[0].x, z: img.pts[0].z, s: 0 };
            if (tau >= t[n]) return { x: img.pts[n].x, z: img.pts[n].z, s: img.s[n] };
            let lo = 0, hi = n;
            while (hi - lo > 1) {
                const mid = (lo + hi) >> 1;
                if (t[mid] <= tau) lo = mid; else hi = mid;
            }
            const f = (tau - t[lo]) / (t[hi] - t[lo]);
            const a = img.pts[lo], b = img.pts[hi];
            return { x: a.x + (b.x - a.x) * f, z: a.z + (b.z - a.z) * f, s: img.s[lo] + (img.s[hi] - img.s[lo]) * f };
        }

        function updateSource(t) {
            if (t < INSPIRAL_DURATION) {
                bh1.visible = true;
                bh2.visible = true;
                mergedBH.visible = false;
                mergeFlash.material.opacity = 0;
                const o = orbitState(t);
                // Each hole orbits the centre of mass (mass taken proportional to radius)
                const r1 = o.sep * BH2_RADIUS / (BH1_RADIUS + BH2_RADIUS);
                const r2 = o.sep * BH1_RADIUS / (BH1_RADIUS + BH2_RADIUS);
                bh1.position.set(r1 * Math.cos(o.phi), 0, r1 * Math.sin(o.phi));
                bh2.position.set(-r2 * Math.cos(o.phi), 0, -r2 * Math.sin(o.phi));
            } else {
                bh1.visible = false;
                bh2.visible = false;
                mergedBH.visible = true;
                // The remnant starts elongated along the last orbit and settles into a sphere (ringdown)
                const dt = t - INSPIRAL_DURATION;
                const grow = (BH1_RADIUS + (MERGED_RADIUS - BH1_RADIUS) * smoothstep(0, 0.3, dt)) / MERGED_RADIUS;
                const e = 0.3 * Math.exp(-dt / 0.25);
                mergedBH.scale.set(grow * (1 + e), grow * (1 - 0.3 * e), grow * (1 - 0.5 * e));
                mergedBH.rotation.y = -(PHI_END + OMEGA_MAX * dt);
                mergeFlash.material.opacity = 0.7 * Math.exp(-dt / 0.3);
            }
        }

        const cBase = GRID_BASE_COLOR, cSpiral = UNSPLIT_COLOR;
        function updateGrid(t, tauD) {
            // State of the wave packets, one per image
            const beams = [];
            if (tauD > 0) {
                for (const img of images) {
                    const hs = headState(img, tauD);
                    const dxh = hs.x - SOURCE_POS.x, dzh = hs.z - SOURCE_POS.z;
                    const Rh = Math.sqrt(dxh * dxh + dzh * dzh);
                    let fade = smoothstep(0, 70, Rh);
                    if (tauD > img.T) fade *= Math.exp(-(tauD - img.T) / 0.25);
                    if (fade < 1e-3) continue;
                    // The lens magnifies each image and adds its Morse phase as the packet passes it
                    const lensW = smoothstep(img.sLens - 60, img.sLens + 60, hs.s);
                    beams.push({
                        cx: hs.x + dxh / Rh * 10, cz: hs.z + dzh / Rh * 10, // centred a bit ahead of the merger front
                        Rh, fade,
                        amp: GRID_WAVE_AMP * (unlensedAmp + (img.amp - unlensedAmp) * lensW),
                        phase: img.phase * lensW,
                        color: UNSPLIT_COLOR.clone().lerp(img.color, lensW),
                    });
                }
            }
            const spiralOn = t < INSPIRAL_DURATION + SPIRAL_RADIUS / WAVE_SPEED + 0.5;
            const R2 = BEAM_RADIUS * BEAM_RADIUS;

            const arr = spacetimePlane.geometry.attributes.position.array;
            const carr = spacetimePlane.geometry.attributes.color.array;
            const n = arr.length / 3;
            for (let i = 0; i < n; i++) {
                const x = staticVertices[3 * i], z = -staticVertices[3 * i + 1];
                const dxs = x - SOURCE_POS.x, dzs = z - SOURCE_POS.z;
                const r = Math.sqrt(dxs * dxs + dzs * dzs);
                let disp = 0;
                let cr = cBase.r, cg = cBase.g, cb = cBase.b;

                // Rotating quadrupole pattern radiated by the binary (retarded time t - r/c)
                if (spiralOn && r < SPIRAL_RADIUS) {
                    const tret = t - r / WAVE_SPEED;
                    if (tret > 0) {
                        let A, ph;
                        if (tret < INSPIRAL_DURATION) {
                            const o = orbitState(tret);
                            A = Math.min(1, MERGE_SEP / Math.max(o.sep, 1e-3));
                            ph = o.phi;
                        } else {
                            const dt = tret - INSPIRAL_DURATION;
                            A = Math.exp(-dt / 0.09);
                            ph = PHI_END + OMEGA_MAX * dt;
                        }
                        if (A > 1e-3) {
                            const fall = smoothstep(5, 20, r) * Math.pow(1 - r / SPIRAL_RADIUS, 1.5);
                            disp += SPIRAL_AMP * fall * A * Math.cos(2 * (Math.atan2(dzs, dxs) - ph));
                            const w = Math.min(1, fall * A);
                            cr += (cSpiral.r - cr) * w; cg += (cSpiral.g - cg) * w; cb += (cSpiral.b - cb) * w;
                        }
                    }
                }

                // Lensed packets: chirp as a function of distance ahead of the merger wavefront
                let num = 0, envSum = 0;
                for (let b = 0; b < beams.length; b++) {
                    const B = beams[b];
                    const dx = x - B.cx, dz = z - B.cz;
                    const d2 = dx * dx + dz * dz;
                    if (d2 < R2) {
                        const e = Math.pow(1 - Math.sqrt(d2) / BEAM_RADIUS, 2) * B.fade;
                        const h = gridWave(r - B.Rh, B.phase);
                        num += B.amp * e * h;
                        envSum += e;
                        const w = Math.min(1, e * (0.3 + 0.7 * Math.abs(h)) * 1.7);
                        cr += (B.color.r - cr) * w; cg += (B.color.g - cg) * w; cb += (B.color.b - cb) * w;
                    }
                }
                disp += num / Math.max(1, envSum);

                arr[3 * i + 2] = staticVertices[3 * i + 2] + disp;
                carr[3 * i] = cr; carr[3 * i + 1] = cg; carr[3 * i + 2] = cb;
            }
            spacetimePlane.geometry.attributes.position.needsUpdate = true;
            spacetimePlane.geometry.attributes.color.needsUpdate = true;
        }

        function imageStrain(img, tau) {
            return img.amp * (img.micro ? microStrain(tau) : waveform(tau, img.phase));   // image 1 is a minimum (phase 0)
        }
        function detectorStrain(tauD) {
            let h = 0;
            for (const img of images) h += imageStrain(img, tauD - img.T);
            return h;
        }

        // Real time delays: tau is in units of theta_E^2, and
        // dt = (1 + z_L) / c * D_L D_S / D_LS * theta_E^2 * dtau (flat LCDM, H0 = 70, Omega_m = 0.3,
        // z_L = 0.5, z_S = 2). Galaxy: sigma = 250 km/s, theta_E = 1.15 arcsec. Cluster: theta_E = 10 arcsec.
        const DAYS_PER_TAU = { galaxy: 109, cluster: 8320 };
        function realDelayDays(a, b) {
            return Math.abs(b.tau - a.tau) * DAYS_PER_TAU[lens === LENSES.galaxy ? 'galaxy' : 'cluster'];
        }
        function formatDelay(days) {
            if (days * 24 < 1) return 'under 1 hour';
            if (days < 1) { const h = Math.round(days * 24); return h === 1 ? '1 hour' : `${h} hours`; }
            if (days < 60) { const d = Math.round(days); return d === 1 ? '1 day' : `${d} days`; }
            if (days < 730) return `${Math.round(days / 30.44)} months`;
            const yr = days / 365.25;
            return `${yr < 10 ? yr.toFixed(1) : Math.round(yr)} years`;
        }

        // --- Strain read-out ---
        const hcanvas = document.getElementById('hcanvas');
        const hctx = hcanvas.getContext('2d');
        function resizePanel() {
            const rect = hcanvas.getBoundingClientRect();
            if (rect.width < 100) return;   // hidden: keep the last size
            const dpr = window.devicePixelRatio || 1;
            hcanvas.width = Math.round(rect.width * dpr);
            hcanvas.height = Math.round(rect.height * dpr);
            hctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }

        // Text in Latin Modern ('rm'), maths in Computer Modern upright ('mu') and italic ('mi'), as in LaTeX
        const PANEL_FONTS = { rm: 'LMText', mu: 'CMMain', mi: 'CMMath' };
        function richText(parts, x, y, size, align, color) {
            const w = richWidth(parts, size);
            let cx = align === 'center' ? x - w / 2 : align === 'right' ? x - w : x;
            hctx.textAlign = 'left';
            hctx.fillStyle = color;
            for (const [text, style] of parts) {
                hctx.font = `${size}px ${PANEL_FONTS[style]}`;
                hctx.fillText(text, cx, y);
                cx += hctx.measureText(text).width;
            }
            return w;
        }
        function richWidth(parts, size) {
            let w = 0;
            for (const [text, style] of parts) {
                hctx.font = `${size}px ${PANEL_FONTS[style]}`;
                w += hctx.measureText(text).width;
            }
            return w;
        }
        function formatMu(mu) {
            return mu < 1 ? mu.toFixed(2) : mu < 10 ? mu.toFixed(1) : mu.toFixed(0);
        }

        function drawPanel(tauD) {
            const W = hcanvas.clientWidth, H = hcanvas.clientHeight;
            if (W < 100) return;   // hidden (H): nothing to draw
            const first = images[0], last = images[images.length - 1];
            hctx.clearRect(0, 0, W, H);
            const padL = 16, padR = 16, top = 46, bottom = 28;
            const t0 = first.T - CHIRP_DURATION - 0.15, t1 = last.T + 0.35;
            const xOf = (t) => padL + (t - t0) / (t1 - t0) * (W - padL - padR);
            const y0 = top + (H - top - bottom) / 2;
            const yAmp = (H - top - bottom) / 2 * 0.95 / strainMax;
            const FS = 17;
            hctx.textBaseline = 'alphabetic';

            const titleW = richText([['Strain at the detector  ', 'rm'], ['h', 'mi'], ['(', 'mu'], ['t', 'mi'], [')', 'mu']], padL, 21, FS, 'left', '#8DB3E2');
            const head = [[`${lensModelName()} with  `, 'rm'], ['y', 'mi'], [` = ${sourceY.toFixed(2)}`, 'mu']];
            if (ellipticity > 0) head.push([',  ', 'rm'], ['ε', 'mi'], [` = ${ellipticity.toFixed(2)}`, 'mu']);
            head.push([images.length > 1 ? ',  time axis not to scale' : ',  not to scale', 'rm']);
            // the right-hand caption is left out when the panel is too narrow for both (phones)
            if (padL + titleW + 24 + richWidth(head, FS) <= W - padR) richText(head, W - padR, 21, FS, 'right', 'rgba(255,255,255,0.55)');
            // dashed legend, under the title
            if (images.length <= 3 || microOn) {
            hctx.save();
            hctx.setLineDash([4, 4]);
            hctx.strokeStyle = 'rgba(255,255,255,0.55)';
            hctx.lineWidth = 1;
            hctx.beginPath(); hctx.moveTo(padL, 36); hctx.lineTo(padL + 22, 36); hctx.stroke();
            hctx.restore();
            richText([[!microOn ? 'without the lens' : images.length <= 3 ? 'without the lens (image 1: without the star)' : 'image 1 without the star', 'rm']], padL + 28, 40, 13, 'left', 'rgba(255,255,255,0.55)');
            }

            hctx.strokeStyle = 'rgba(255,255,255,0.15)';
            hctx.lineWidth = 1;
            hctx.beginPath();
            hctx.moveTo(padL, y0);
            hctx.lineTo(W - padR, y0);
            hctx.stroke();

            // Trace coloured by whichever image dominates at each moment
            const tEnd = Math.min(tauD, t1);
            if (tEnd > t0) {
                const step = (t1 - t0) / ((W - padL - padR) * 3);
                const dominant = (t) => {
                    let best = 0, bestA = -1;
                    images.forEach((img, k) => { const a = img.amp * waveAmp(t - img.T); if (a > bestA) { bestA = a; best = k; } });
                    return best;
                };
                hctx.lineWidth = 1.5;
                hctx.lineJoin = 'round';
                let cur = dominant(t0);
                hctx.beginPath();
                hctx.moveTo(xOf(t0), y0 - yAmp * detectorStrain(t0));
                for (let t = t0 + step; t <= tEnd; t += step) {
                    const px = xOf(t), py = y0 - yAmp * detectorStrain(t);
                    hctx.lineTo(px, py);
                    const d = dominant(t);
                    if (d !== cur) {
                        hctx.strokeStyle = images[cur].css;
                        hctx.stroke();
                        hctx.beginPath();
                        hctx.moveTo(px, py);
                        cur = d;
                    }
                }
                hctx.strokeStyle = images[cur].css;
                hctx.stroke();

                // Dashed: each copy next to the signal the detector would get without the lens (same arrival
                // time, amplitude 1/sqrt(mu_1) in units of image 1, no Morse phase); the microlensed copy is
                // compared with itself without the star
                const unlensed = 1 / Math.sqrt(first.mu);
                const showRefs = images.length <= 3;
                hctx.save();
                hctx.setLineDash([4, 4]);
                hctx.strokeStyle = 'rgba(255,255,255,0.45)';
                hctx.lineWidth = 1;
                for (const img of images) {
                    const ta = Math.max(t0, img.T - CHIRP_DURATION), tb = Math.min(tEnd, img.T + 0.3);
                    if (tb <= ta || !(showRefs || img.micro)) continue;
                    const A = img.micro ? img.amp : unlensed, ph = img.micro ? img.phase : 0;
                    hctx.beginPath();
                    hctx.moveTo(xOf(ta), y0 - yAmp * A * waveform(ta - img.T, ph));
                    for (let t = ta + step; t <= tb; t += step) hctx.lineTo(xOf(t), y0 - yAmp * A * waveform(t - img.T, ph));
                    hctx.stroke();
                }
                hctx.restore();
            }

            // Labels centred under each whole wave; if neighbours would overlap, the word "phase" goes,
            // then the font shrinks (the layout uses every image, so nothing moves when a copy arrives)
            const makeParts = (img, short) => {
                const parts = [[short ? `${img.label} (` : `${img.label}  (`, 'rm'], ['μ', 'mi'], [` ≈ ${formatMu(img.mu)}`, 'mu']];
                const ph = short ? ', ' : ',  phase  ';
                if (img.type === 2) parts.push([ph, 'rm'], ['−', 'mu'], ['π', 'mi'], ['/2', 'mu']);
                if (img.type === 3) parts.push([ph, 'rm'], ['−', 'mu'], ['π', 'mi']);
                if (img.micro) parts.push([short ? ', micro' : ',  microlensed', 'rm']);
                parts.push([')', 'rm']);
                return parts;
            };
            const centres = images.map(img => xOf(img.T - (CHIRP_DURATION - 0.15) / 2));
            const fitsAt = (short, size) => {
                const ws = images.map(img => richWidth(makeParts(img, short), size));
                for (let k = 0; k < images.length; k++) {
                    if (centres[k] - ws[k] / 2 < padL - 4 && k > 0) return false;
                    if (k && centres[k] - centres[k - 1] < (ws[k] + ws[k - 1]) / 2 + 14) return false;
                }
                return true;
            };
            let short = images.length > 3, LFS = short ? 15 : FS;
            if (!short && !fitsAt(false, LFS)) short = true;
            while (LFS > 11 && !fitsAt(short, LFS)) LFS--;
            const labels = images.map((img, k) => {
                const parts = makeParts(img, short), w = richWidth(parts, LFS);
                return { parts, w, x: centres[k] - w / 2, css: img.css, T: img.T };
            });
            for (let k = 0; k < labels.length; k++) {
                labels[k].x = Math.max(labels[k].x, k ? labels[k - 1].x + labels[k - 1].w + 14 : padL);
            }
            for (let k = labels.length - 1; k >= 0; k--) {
                const limit = k === labels.length - 1 ? W - padR : labels[k + 1].x - 14;
                labels[k].x = Math.min(labels[k].x, limit - labels[k].w);
            }
            for (const L of labels) if (tauD >= L.T) richText(L.parts, L.x, H - 8, LFS, 'left', L.css);

            // Real time delay between each pair of consecutive copies, shown once the later one has arrived
            for (let k = 1; k < images.length; k++) {
                const A = images[k - 1], B = images[k];
                if (tauD < B.T) break;
                const xa = xOf(A.T), xb = xOf(B.T), yb = 36;
                hctx.strokeStyle = 'rgba(255,255,255,0.6)';
                hctx.lineWidth = 1;
                hctx.beginPath();
                hctx.moveTo(xa + 2, yb - 4); hctx.lineTo(xa + 2, yb + 4);
                hctx.moveTo(xa + 2, yb); hctx.lineTo(xb - 2, yb);
                hctx.moveTo(xb - 2, yb - 4); hctx.lineTo(xb - 2, yb + 4);
                hctx.stroke();
                const value = formatDelay(realDelayDays(A, B));
                let size = images.length > 3 ? 14 : FS;
                let label = [['Δ', 'mu'], ['t', 'mi'], [' ≈ ', 'mu'], [value, 'rm']];
                if (richWidth(label, size) + 12 > xb - xa) label = [[value, 'rm']];
                while (size > 11 && richWidth(label, size) + 12 > xb - xa) size--;
                const lw = richWidth(label, size) + 10;
                hctx.fillStyle = 'rgba(0,0,0,0.9)';
                hctx.fillRect((xa + xb) / 2 - lw / 2, yb - 9, lw, 18);
                richText(label, (xa + xb) / 2, yb + 5, size, 'center', '#ffffff');
            }
        }

        // --- Caustics panel: source plane (caustics, source) and image plane (critical curves, images) ---
        const ccanvas = document.getElementById('ccanvas');
        const cctx = ccanvas.getContext('2d');
        const CAUSTIC_COLOR = '#ff7a7a';
        const PLANE_RANGE = 1.9;   // half-width of each plane, in units of theta_E
        const PLANE_LIN = 1.2, PLANE_EDGE = 1.8;   // true scale inside PLANE_LIN, compressed towards PLANE_EDGE
        const Y_MAX = 2.5;         // same as the slider
        let dragging = false;

        function causticGeometry() {
            const W = ccanvas.clientWidth, H = ccanvas.clientHeight;
            const half = W / 2, top = 32, bottom = 24;
            const R = Math.min(half - 20, H - top - bottom) / 2;
            return { W, H, R, scale: R / PLANE_RANGE, src: { x: half / 2, y: top + R + 2 }, img: { x: half + half / 2, y: top + R + 2 } };
        }

        // distance from the centre on the panel (theta_E units); the critical curves and caustics sit in the linear part
        function panelR(r) {
            const a = Math.abs(r), w = PLANE_EDGE - PLANE_LIN;
            const m = a <= PLANE_LIN ? a : PLANE_LIN + w * Math.tanh((a - PLANE_LIN) / w);
            return Math.sign(r) * m;
        }
        function panelRInverse(m) {
            const w = PLANE_EDGE - PLANE_LIN;
            return m <= PLANE_LIN ? m : PLANE_LIN + w * Math.atanh(Math.min(0.995, (m - PLANE_LIN) / w));
        }

        function setupCausticsPanel() {
            const resize = () => {
                const rect = ccanvas.getBoundingClientRect();
                const dpr = window.devicePixelRatio || 1;
                ccanvas.width = Math.round(rect.width * dpr);
                ccanvas.height = Math.round(rect.height * dpr);
                cctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            };
            resize();
            window.addEventListener('resize', resize);
            // Drag the source around the source plane; the lens is round, so only the distance matters
            const move = (e) => {
                const g = causticGeometry();
                const r = ccanvas.getBoundingClientRect();
                const px = e.clientX - r.left - g.src.x, py = e.clientY - r.top - g.src.y;
                sourcePhi = Math.atan2(-py, px);
                sourceY = Math.min(Y_MAX, Math.round(srcRInverse(Math.hypot(px, py) / g.scale) * 100) / 100);
                document.getElementById('yslider').value = sourceY;
                leaveScenario();
                buildLensScene();
            };
            ccanvas.addEventListener('pointerdown', (e) => {
                const g = causticGeometry();
                const r = ccanvas.getBoundingClientRect();
                if (e.clientX - r.left > g.W / 2) return;
                dragging = true;
                ccanvas.setPointerCapture(e.pointerId);
                move(e);
            });
            ccanvas.addEventListener('pointermove', (e) => { if (dragging) move(e); });
            ccanvas.addEventListener('pointerup', () => { dragging = false; });
        }

        function drawRich(ctx, parts, x, y, size, align, color) {
            // the strain panel's rich-text helper, on another canvas
            let w = 0;
            for (const [text, style] of parts) { ctx.font = `${size}px ${PANEL_FONTS[style]}`; w += ctx.measureText(text).width; }
            let px = align === 'center' ? x - w / 2 : align === 'right' ? x - w : x;
            ctx.textAlign = 'left';
            ctx.fillStyle = color;
            for (const [text, style] of parts) {
                ctx.font = `${size}px ${PANEL_FONTS[style]}`;
                ctx.fillText(text, px, y);
                px += ctx.measureText(text).width;
            }
        }
        const ctext = (parts, x, y, size, align, color) => drawRich(cctx, parts, x, y, size, align, color);

        // sky position (theta_E units) -> panel pixels: the image plane is true to scale inside PLANE_LIN;
        // the source plane, where the caustics are small, is zoomed SRC_ZOOM times and saturates smoothly
        const SRC_ZOOM = 2, SRC_EDGE = 1.85;
        const srcR = (r) => SRC_EDGE * Math.tanh(SRC_ZOOM * r / SRC_EDGE);
        const srcRInverse = (m) => SRC_EDGE * Math.atanh(Math.min(0.999, m / SRC_EDGE)) / SRC_ZOOM;
        function toPanel(c, g, x, y) {
            const r = Math.hypot(x, y);
            const k = r > 1e-9 ? (c === g.src ? srcR(r) : panelR(r)) / r : (c === g.src ? SRC_ZOOM : 1);
            return [c.x + x * k * g.scale, c.y - y * k * g.scale];
        }
        function strokeSegments(c, g, segs) {
            cctx.beginPath();
            for (const sg of segs) {
                const [ax, ay] = toPanel(c, g, sg[0], sg[1]), [bx, by] = toPanel(c, g, sg[2], sg[3]);
                cctx.moveTo(ax, ay); cctx.lineTo(bx, by);
            }
            cctx.stroke();
        }
        function segmentDistance(px, py, segs) {
            let best = Infinity;
            for (const [x1, y1, x2, y2] of segs) {
                const dx = x2 - x1, dy = y2 - y1, l2 = dx * dx + dy * dy;
                const t = l2 > 0 ? Math.max(0, Math.min(1, ((px - x1) * dx + (py - y1) * dy) / l2)) : 0;
                best = Math.min(best, Math.hypot(px - x1 - t * dx, py - y1 - t * dy));
            }
            return best;
        }
        function topPoint(segs) {
            let p = [0, 0], best = -Infinity;
            for (const sg of segs) for (const k of [0, 2]) if (sg[k + 1] > best) { best = sg[k + 1]; p = [sg[k], sg[k + 1]]; }
            return p;
        }

        function drawCaustics() {
            const g = causticGeometry();
            if (!g.W) return;   // panel hidden (K)
            const dpr = window.devicePixelRatio || 1;
            if (ccanvas.width !== Math.round(g.W * dpr)) {
                ccanvas.width = Math.round(g.W * dpr);
                ccanvas.height = Math.round(g.H * dpr);
                cctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            }
            cctx.clearRect(0, 0, g.W, g.H);
            const C = lensCurves;
            const y1 = sourceY * Math.cos(sourcePhi), y2 = sourceY * Math.sin(sourcePhi);
            const ux = Math.cos(sourcePhi), uy = -Math.sin(sourcePhi);

            // divider
            cctx.strokeStyle = 'rgba(141,179,226,0.35)';
            cctx.lineWidth = 1;
            cctx.beginPath(); cctx.moveTo(g.W / 2, 10); cctx.lineTo(g.W / 2, g.H - 10); cctx.stroke();

            ctext([['Source plane  (zoom ', 'rm'], ['×', 'mu'], ['2)', 'rm']], g.src.x, 20, 15, 'center', '#8DB3E2');
            ctext([['Image plane', 'rm']], g.img.x, 20, 15, 'center', '#8DB3E2');

            for (const c of [g.src, g.img]) {
                cctx.strokeStyle = 'rgba(255,255,255,0.12)';
                cctx.beginPath();
                cctx.moveTo(c.x - g.R, c.y); cctx.lineTo(c.x + g.R, c.y);
                cctx.moveTo(c.x, c.y - g.R); cctx.lineTo(c.x, c.y + g.R);
                cctx.stroke();
            }

            // Source plane. A round lens squeezes its whole tangential critical curve into one point;
            // ellipticity opens that point into a diamond. The cored cluster also has a radial caustic, the
            // singular galaxy a cut (dashed) where its innermost image disappears.
            // A curve lights up when the source sits on it: there images merge and the magnification blows up.
            const pointLike = C.tSize < 0.02;
            const outer = C.rCaus.length ? C.rCaus : C.cutSegs;
            const nearT = (pointLike ? Math.hypot(y1, y2) : segmentDistance(y1, y2, C.tCaus)) < 0.04;
            const nearO = outer.length > 0 && segmentDistance(y1, y2, outer) < 0.04;
            const curve = (near) => {
                cctx.strokeStyle = near ? '#ffd0d0' : CAUSTIC_COLOR;
                cctx.fillStyle = cctx.strokeStyle;
                cctx.lineWidth = near ? 3 : 1.5;
                cctx.shadowColor = CAUSTIC_COLOR;
                cctx.shadowBlur = near ? 12 : 0;
            };
            const LABEL = 'rgba(255,122,122,0.85)';
            curve(nearT);
            if (pointLike) { cctx.beginPath(); cctx.arc(g.src.x, g.src.y, nearT ? 4 : 3, 0, 2 * Math.PI); cctx.fill(); }
            else strokeSegments(g.src, g, C.tCaus);
            curve(nearO);
            if (C.rCaus.length) strokeSegments(g.src, g, C.rCaus);
            else if (C.cut.length) {
                cctx.setLineDash([4, 4]);
                cctx.beginPath();
                C.cut.forEach(([a, b], k) => { const [px, py] = toPanel(g.src, g, a, b); if (k) cctx.lineTo(px, py); else cctx.moveTo(px, py); });
                cctx.stroke();
                cctx.setLineDash([]);
            }
            curve(false);
            // labels: the tangential caustic gets a thin leader from the centre
            cctx.strokeStyle = 'rgba(255,122,122,0.45)';
            cctx.lineWidth = 1;
            cctx.beginPath(); cctx.moveTo(g.src.x - 3, g.src.y + 4); cctx.lineTo(g.src.x - 0.5 * g.R, g.src.y + 0.76 * g.R); cctx.stroke();
            ctext([['tangential', 'rm']], g.src.x - 0.5 * g.R - 3, g.src.y + 0.76 * g.R + 12, 12, 'center', LABEL);
            if (outer.length) {
                const [ox, oy] = toPanel(g.src, g, ...topPoint(outer));
                ctext([[C.rCaus.length ? 'radial' : 'cut', 'rm']], ox, oy - 6, 12, 'center', LABEL);
            }

            // source
            const [sx, sy] = toPanel(g.src, g, y1, y2);
            cctx.fillStyle = '#c77dff';
            cctx.beginPath(); cctx.arc(sx, sy, 5, 0, 2 * Math.PI); cctx.fill();

            // Image plane: tangential critical curve (about the Einstein radius) and the radial one
            curve(nearT);
            strokeSegments(g.img, g, C.tCrit);
            if (C.rCrit.length) { curve(nearO); strokeSegments(g.img, g, C.rCrit); }
            curve(false);
            {
                let lx = 0, ly = 0, best = -Infinity;
                for (const sg of C.tCrit) if (sg[1] - sg[0] > best) { best = sg[1] - sg[0]; lx = sg[0]; ly = sg[1]; }
                const [tx, ty] = toPanel(g.img, g, lx, ly);
                ctext([['tangential', 'rm']], tx - 2, ty - 4, 12, 'right', LABEL);
            }
            if (C.rCrit.length) {
                let rx = 0, ry = 0, best = -Infinity;
                for (const sg of C.rCrit) if (sg[0] + sg[1] > best) { best = sg[0] + sg[1]; rx = sg[0]; ry = sg[1]; }
                const [px, py] = toPanel(g.img, g, rx, ry);
                ctext([['radial', 'rm']], px + 4, py - 2, 12, 'left', LABEL);
            }
            cctx.strokeStyle = 'rgba(199,125,255,0.3)';
            cctx.lineWidth = 1;
            cctx.setLineDash([3, 4]);
            cctx.beginPath();
            cctx.moveTo(g.img.x - g.R * ux, g.img.y - g.R * uy); cctx.lineTo(g.img.x + g.R * ux, g.img.y + g.R * uy);
            cctx.stroke();
            cctx.setLineDash([]);
            cctx.fillStyle = '#ffd29a';
            cctx.beginPath(); cctx.arc(g.img.x, g.img.y, 3.5, 0, 2 * Math.PI); cctx.fill();
            images.forEach((img) => {
                const [ix, iy] = toPanel(g.img, g, img.p1, img.p2);
                cctx.fillStyle = img.css;
                cctx.beginPath(); cctx.arc(ix, iy, Math.min(11, 2 + 3.4 * Math.pow(img.mu, 0.35)), 0, 2 * Math.PI); cctx.fill();
                if (img.micro) {
                    // the star that microlenses this image
                    cctx.fillStyle = '#ffffff';
                    cctx.beginPath(); cctx.arc(ix + 7, iy - 7, 2.2, 0, 2 * Math.PI); cctx.fill();
                }
            });

            // legend
            ctext([['caustics', 'rm']], g.src.x, g.H - 8, 13, 'center', CAUSTIC_COLOR);
            ctext([['critical curves', 'rm']], g.img.x, g.H - 8, 13, 'center', CAUSTIC_COLOR);
        }

        const _q = new THREE.Quaternion();
        const obsPos = new THREE.Vector3(), obsLook = new THREE.Vector3();
        function updateView(dt, tauD) {
            // Camera: glide between the orbiting view and the detector looking at the lens
            if (obsTarget !== obsBlend) {
                obsBlend = obsTarget ? Math.min(1, obsBlend + dt / 1.6) : Math.max(0, obsBlend - dt / 1.6);
            }
            if (obsBlend > 0) {
                const e = smoothstep(0, 1, obsBlend);
                obsPos.set(OBSERVER_POS.x - 15, OBSERVER_POS.y + 22, OBSERVER_POS.z);
                obsLook.set(0, LENS_Y - 0.3 * lens.thetaE, 0);
                camera.position.lerpVectors(orbitSaved.pos, obsPos, e);
                controls.target.lerpVectors(orbitSaved.target, obsLook, e);
                const fovObs = lens === LENSES.galaxy ? 54 : 72;
                camera.fov = orbitSaved.fov + (fovObs - orbitSaved.fov) * e;
                camera.updateProjectionMatrix();
                camera.lookAt(controls.target);
            } else {
                if (!controls.enabled) {
                    controls.enabled = true;
                    controls.autoRotate = true;
                    camera.fov = orbitSaved.fov;
                    camera.updateProjectionMatrix();
                }
                controls.update();
            }

            // The observer sees the images, not the source itself; each image flashes as its copy arrives
            const hide = obsBlend > 0.5;
            sourceGroup.visible = !hide;
            detectorLabel.visible = !hide;
            lensLabels.forEach((label, k) => { if (k !== 1) label.visible = !hide; }); // keep only the lens name
            skyImages.forEach((s, k) => {
                const img = images[k];
                if (!img) return;
                const flash = waveAmp(tauD - img.T);
                s.material.opacity = smoothstep(0.3, 1, obsBlend) * (0.55 + 0.45 * flash) * (0.6 + 0.4 * img.amp);
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();
            const dt = Math.min(0.1, elapsedTime - lastElapsed);
            lastElapsed = elapsedTime;
            if (!paused) simTime += dt;
            const cycleTime = (simTime - cycleStart) % CYCLE_DURATION;
            const tauD = cycleTime - INSPIRAL_DURATION; // time since the merger

            updateSource(cycleTime);
            updateGrid(cycleTime, tauD);

            // Detector arms follow the strain: the sum of all lensed copies
            const h = detectorStrain(tauD) / strainMax;
            detectorArm1.scale.y = 1 + 0.28 * h;
            detectorArm2.scale.y = 1 - 0.28 * h;
            drawPanel(tauD);
            drawCaustics();

            galaxyGroup.rotation.y += 0.0008;
            clusterGroup.rotation.y += 0.0004;

            updateView(dt, tauD);

            for (const quad of billboards) {
                quad.parent.getWorldQuaternion(_q);
                quad.quaternion.copy(_q.invert().multiply(camera.quaternion));
            }
            // Keep labels facing camera
            for (const label of textLabels) {
                label.quaternion.copy(camera.quaternion);
            }

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            resizePanel();
            layoutInfo();
        }

        function generateGlowTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 128;
            canvas.height = 128;
            const context = canvas.getContext('2d');
            const gradient = context.createRadialGradient(64, 64, 0, 64, 64, 64);
            gradient.addColorStop(0, 'rgba(255,255,255,1)');
            gradient.addColorStop(0.3, 'rgba(255,255,255,0.6)');
            gradient.addColorStop(1, 'rgba(255,255,255,0)');
            context.fillStyle = gradient;
            context.fillRect(0, 0, 128, 128);
            return canvas;
        }
